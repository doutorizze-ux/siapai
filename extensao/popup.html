<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SiapAI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <header class="topo">
      <div class="logo-badge" aria-hidden="true">S</div>
      <div>
        <h1>SiapAI</h1>
        <p>Planejamento inteligente para o SIAP</p>
      </div>
    </header>

    <section class="notice" aria-label="Como usar">
      <strong>Abra uma tela do SIAP</strong>
      <span>Os módulos aparecem nas páginas compatíveis de planejamento, frequência, conteúdo e PEI.</span>
    </section>

    <section class="license-card" id="statusCard" aria-live="polite">
      <div class="license-icon" aria-hidden="true">✓</div>
      <div class="license-info">
        <strong id="statusTitulo">Verificando licença…</strong>
        <span id="statusDetail">Aguarde um instante.</span>
        <b id="validadePlano">—</b>
      </div>
      <span class="badge" id="statusBadge">…</span>
    </section>

    <button class="refresh" id="btnAtualizar" type="button">Atualizar status</button>

    <footer>
      <span>Seus dados ficam protegidos.</span>
      <small>A extensão não solicita a senha do SIAP.</small>
      <small class="versao">SiapAI v5.3.0</small>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
